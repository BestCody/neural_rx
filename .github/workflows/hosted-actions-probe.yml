name: Hosted Actions Probe

on:
  push:
    branches:
      - experiment/temporal-ue-memory-training
    paths:
      - .github/workflows/hosted-actions-probe.yml

permissions:
  actions: write
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/temporal-ue-memory-training
          fetch-depth: 1
      - name: Inspect self-hosted runners and workflow queue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p results/temporal_suite_validation
          gh api "repos/$GITHUB_REPOSITORY/actions/runners?per_page=100" \
            --jq '{total_count, runners: [.runners[] | {id,name,os,status,busy,labels:[.labels[].name]}]}' \
            > results/temporal_suite_validation/runners_probe.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=experiment%2Ftemporal-ue-memory-training&per_page=50" \
            --jq '{workflow_runs: [.workflow_runs[] | {id,name,path,event,status,conclusion,head_sha,run_number,created_at,updated_at}]}' \
            > results/temporal_suite_validation/actions_runs_probe.json
      - name: Persist probe evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/temporal_suite_validation/runners_probe.json \
                  results/temporal_suite_validation/actions_runs_probe.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "results: record self-hosted runner state"
          git push origin HEAD:experiment/temporal-ue-memory-training
