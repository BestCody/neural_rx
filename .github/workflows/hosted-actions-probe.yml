name: Hosted Actions Probe

on:
  push:
    branches:
      - experiment/temporal-ue-memory-training
    paths:
      - .github/workflows/hosted-actions-probe.yml

permissions:
  actions: write
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/temporal-ue-memory-training
          fetch-depth: 1
      - name: Cancel redundant queued self-hosted runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=experiment%2Ftemporal-ue-memory-training&per_page=50" > "$tmp"

          latest_diag="$(jq -r '[.workflow_runs[] | select(.name == "Diagnose Temporal Suite Results" and .status == "queued")] | sort_by(.run_number) | last | .id // empty' "$tmp")"

          jq -r '.workflow_runs[] | select(.status == "queued") | [.id,.name] | @tsv' "$tmp" |
          while IFS=$'\t' read -r id name; do
            if [[ "$name" == "Run Temporal Research Suite V3" ]]; then
              echo "Cancelling accidental exhaustive rerun $id"
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" >/dev/null || true
            elif [[ "$name" == "Diagnose Temporal Suite Results" && "$id" != "$latest_diag" ]]; then
              echo "Cancelling stale diagnostic run $id"
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" >/dev/null || true
            fi
          done

          sleep 2
          mkdir -p results/temporal_suite_validation
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs?branch=experiment%2Ftemporal-ue-memory-training&per_page=50" \
            --jq '{workflow_runs: [.workflow_runs[] | {id,name,path,event,status,conclusion,head_sha,run_number,created_at,updated_at}]}' \
            > results/temporal_suite_validation/actions_runs_probe.json
          printf 'hosted-actions-trigger-ok\n' > results/temporal_suite_validation/hosted_actions_probe.txt
      - name: Persist probe evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/temporal_suite_validation/hosted_actions_probe.txt \
                  results/temporal_suite_validation/actions_runs_probe.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "results: record actions run probe"
          git push origin HEAD:experiment/temporal-ue-memory-training
