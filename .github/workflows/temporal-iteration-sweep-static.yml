name: temporal-iteration-sweep-static

on:
  push:
    branches:
      - experiment/temporal-ue-memory-training
    paths:
      - scripts/evaluate_temporal_iteration_transfer.py
      - scripts/run_temporal_iteration_sweep.py
      - scripts/plot_temporal_iteration_sweep.py
      - .github/workflows/temporal-iteration-sweep-static.yml
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile new sweep scripts
        run: |
          python -m py_compile \
            scripts/evaluate_temporal_iteration_transfer.py \
            scripts/run_temporal_iteration_sweep.py \
            scripts/plot_temporal_iteration_sweep.py
