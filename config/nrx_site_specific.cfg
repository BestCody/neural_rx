[global]
label = 'nrx_site_specific'
ebno = True

[system]
n_size_bwp = 4
num_rx_antennas = 4
mcs_index = [14]
mcs_table = 1
carrier_frequency = 2140000000.0
subcarrier_spacing = 30000.0
n_start_grid = 0
slot_number = 0
frame_number = 0
cyclic_prefix = 'normal'
precoding = 'codebook'
n_cell_id = 1
tpmi = 2
symbol_allocation = [0, 14]
num_antenna_ports = 2
dmrs_mapping_type = "A"
dmrs_config_type = 1
dmrs_type_a_position = 2
dmrs_additional_position = 1
dmrs_length = 1
dmrs_nid = [[1, 1], [1, 1]]
n_scid = 1
num_cdm_groups_without_data = 2
verbose = False
dmrs_port_sets = [[0], [2]]
n_rntis = [1, 1]
n_ids = [1, 1]

[baseline]
demapping_type = 'maxlog'
num_bp_iter = 20
cn_type = 'boxplus'
lmmse_num_prbs = -1

[neural_receiver]
num_nrx_iter = 2
num_nrx_iter_eval = 2
d_s = 56
num_units_init = [128, 128]
num_units_agg = [[64],[64]]
num_units_state = [[128, 128], [128, 128]]
num_units_readout = [128]
max_num_tx = 2
min_num_tx = 1
initial_chest = "ls"
custom_constellation = False
mask_pilots = False

layer_type_dense = "dense"
layer_type_conv = "sepconv"
layer_type_readout = "dense"
nrx_dtype = tf.float32

[training]
training_schedule = {
    "num_iter": [1e3],
    "learning_rate": [0.001],
    "batch_size": [128],
    "train_tx": [False],
    "min_training_snr_db": [[0., 0.]],
    "max_training_snr_db": [[10., 15.]],
    "double_readout": [False],
    "apply_multiloss": [False],
    "weighting_double_readout": [0.01]}

num_iter_train_save = 1000
max_ut_velocity = 56.
min_ut_velocity = 0.
channel_norm = True
cfo_offset_ppm = 0.0
channel_type = 'Dataset'
eval_ebno_db_arr = [10.0]
xla = True
tfrecord_filename = "nrx_site_specific_train.tfrecord"
random_subsampling = False

[evaluation]
snr_db_eval_min = -3
snr_db_eval_max = 16
snr_db_eval_stepsize = 1
max_ut_velocity_eval = 56
min_ut_velocity_eval = 56
cfo_offset_ppm_eval = 0.0
channel_type_eval = "Dataset"
tfrecord_filename_eval = "nrx_site_specific_eval.tfrecord"
channel_norm_eval = True
n_size_bwp_eval = 132
batch_size_eval = 30
batch_size_eval_small = 3
random_subsampling_eval = True
